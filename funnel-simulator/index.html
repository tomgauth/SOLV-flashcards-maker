<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLV Funnel Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  /* De Prof à Pro brand tokens: deliberate single (cream) look, no dark variant */
  :root {
    --canvas: #FDF7EF;
    --grid-dot: #E3D6C4;
    --chrome: #FFFFFF;
    --card: #FFFFFF;
    --card-border: #EFE4D4;
    --ink: #16323A;
    --ink-2: #5F7077;
    --ink-3: #9A8F7E;
    --panel: #16323A;
    --panel-2: #1E3E48;
    --panel-3: #2C4E58;
    --panel-ink: #FDF7EF;
    --panel-ink-2: #9DB2B4;
    --accent: #FB5A63;
    --accent-hover: #D63B46;
    --accent-ink: #FFFFFF;
    --orange: #FF7A2E;
    --flow: #13B0AB;
    --flow-d: #0C7E7B;
    --flow-ink: #FFFFFF;
    --flow-soft: rgba(19, 176, 171, 0.13);
    --danger: #D63B46;
    --danger-soft: rgba(251, 90, 99, 0.12);
    --focus: #0C7E7B;
    --shadow: 0 1px 2px rgba(22, 50, 58, 0.06), 0 14px 34px -26px rgba(22, 50, 58, 0.45);
    --radius: 14px;
    --font-title: "Bricolage Grotesque", Inter, system-ui, sans-serif;
    --font-ui: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --font-hand: Caveat, "Segoe Print", cursive;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.45;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; height: 56px; flex: none;
    background: var(--chrome);
    border-bottom: 1px solid var(--card-border);
  }
  .brand { font-family: var(--font-title); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; margin-right: 4px; }
  .brand .dot { color: var(--accent); }
  .hint-month {
    font-family: var(--font-hand); font-weight: 600; font-size: 20px; color: var(--flow-d);
    transform: rotate(-1.5deg); display: inline-block; white-space: nowrap;
  }
  .topbar select, .btn {
    font: inherit; font-weight: 600; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--card-border);
    border-radius: 10px; padding: 6px 12px; cursor: pointer;
  }
  .btn:hover, .topbar select:hover { border-color: var(--ink); }
  .btn:focus-visible, .topbar select:focus-visible, input:focus-visible, summary:focus-visible, .nav button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }
  .topbar .spacer { flex: 1; }
  .btn-sim {
    font-family: var(--font-title); font-weight: 800;
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    padding: 8px 20px; font-size: 15px; border-radius: 12px;
  }
  .btn-sim:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  /* ---------- Funnel info strip ---------- */
  .infobar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; flex: none;
    background: var(--chrome); border-bottom: 1px solid var(--card-border);
  }
  .infobar .fname { font-family: var(--font-title); font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; margin-right: 4px; }
  .ichip {
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
    border: 1px solid var(--card-border); color: var(--ink-2); background: #fff; white-space: nowrap;
  }
  .ichip.paid { color: var(--accent-hover); background: #feecee; border-color: #fbd0d3; }
  .ichip.organic { color: var(--flow-d); background: #e3f6f4; border-color: #bfe9e5; }
  .ichip.hybrid { color: #b25417; background: #fff0e3; border-color: #fbd9bb; }
  .ichip.warn { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* ---------- Layout ---------- */
  .main { flex: 1; display: flex; min-height: 0; }

  /* ---------- Funnel nav ---------- */
  .nav {
    width: 234px; flex: none; overflow-y: auto;
    background: var(--chrome); border-right: 1px solid var(--card-border);
    padding: 10px 8px 20px;
  }
  .nav .grp {
    font-size: 10.5px; font-weight: 700; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 12px 8px 5px;
  }
  .nav button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; font-size: 13px; font-weight: 600; text-align: left; color: var(--ink);
    background: none; border: none; border-radius: 9px; padding: 7px 9px; cursor: pointer;
  }
  .nav button:hover { background: var(--canvas); }
  .nav button.active { background: var(--panel); color: var(--panel-ink); }
  .nav .fdot { flex: none; width: 8px; height: 8px; border-radius: 3px; }
  .fdot.paid { background: var(--accent); }
  .fdot.organic { background: var(--flow); }
  .fdot.hybrid { background: var(--orange); }
  .fdot.mine { background: var(--ink); }
  .nav button.active .fdot.mine { background: var(--panel-ink); }
  .nav .wmark { margin-left: auto; font-size: 11px; }

  /* ---------- Board ---------- */
  .board-wrap {
    flex: 1; overflow: auto; position: relative;
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.5px);
    background-size: 22px 22px;
    background-color: var(--canvas);
  }
  .board {
    display: flex; align-items: center;
    padding: 48px 40px; min-width: max-content; min-height: 100%;
  }

  /* ---------- Step cards ---------- */
  .step {
    width: 198px; flex: none;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    position: relative;
  }
  .step-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
  .step-icon { flex: none; color: var(--ink-2); display: grid; place-items: center; }
  .step-icon svg { display: block; }
  .ic-accent { fill: var(--accent); stroke: none; }
  .ic-flow { fill: var(--flow); stroke: none; }
  .step-name {
    width: 100%; font-family: var(--font-title); font-weight: 700; font-size: 13.5px;
    letter-spacing: -0.01em; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 2px 4px;
  }
  .step-name:hover { border-color: var(--card-border); }
  .step-name:focus { border-color: var(--focus); outline: none; background: var(--canvas); }
  .step-tools { position: absolute; top: -13px; right: 8px; display: none; gap: 4px; }
  .step:hover .step-tools, .step:focus-within .step-tools { display: flex; }
  .step-tools button {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--card-border); background: var(--chrome); color: var(--ink-2);
    cursor: pointer; font-size: 12px; line-height: 1; display: grid; place-items: center;
    box-shadow: var(--shadow);
  }
  .step-tools button:hover { color: var(--ink); border-color: var(--ink); }
  .step-tools button.del:hover { color: var(--danger); border-color: var(--danger); }
  .step-body { padding: 2px 12px 8px; display: grid; gap: 6px; }
  .frow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .frow label { font-size: 12px; color: var(--ink-2); }
  .frow input {
    width: 74px; font-family: var(--font-num); font-size: 13px; text-align: right;
    color: var(--ink); background: var(--canvas);
    border: 1px solid var(--card-border); border-radius: 6px; padding: 4px 6px;
  }
  .adv { border-top: 1px dashed #e3d6c4; padding-top: 4px; }
  .adv summary { font-size: 11px; color: var(--ink-3); cursor: pointer; list-style: none; user-select: none; }
  .adv summary::before { content: "▸ "; }
  .adv[open] summary::before { content: "▾ "; }
  .adv .frow { margin-top: 6px; }
  .adv input { width: 58px; }
  .step-count {
    border-top: 1px solid var(--card-border);
    padding: 8px 12px 10px; border-radius: 0 0 var(--radius) var(--radius);
    background: var(--flow-soft);
  }
  .step-count .big {
    font-family: var(--font-title); font-variant-numeric: tabular-nums;
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
  }
  .step-count .big .unit { font-family: var(--font-ui); font-size: 11px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
  .step-count .cap { font-size: 11px; color: var(--ink-2); }
  .step-count .money { font-family: var(--font-title); font-size: 14px; font-weight: 800; color: var(--flow-d); }
  .step-count .simrange { font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3); display: block; margin-top: 2px; }

  /* ---------- Connectors ---------- */
  .conn { width: 104px; flex: none; position: relative; height: 96px; }
  .conn .line { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--ink-3); opacity: 0.5; }
  .conn .line::after {
    content: ""; position: absolute; right: -1px; top: -4px;
    border-left: 8px solid var(--ink-3); border-top: 5px solid transparent; border-bottom: 5px solid transparent;
  }
  .conn .dot { position: absolute; top: 31px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); opacity: 0; }
  @keyframes flowdot { from { left: 0; opacity: 0.9; } to { left: 92px; opacity: 0.9; } }
  .conn.animating .dot { animation: flowdot 0.7s linear 2; }
  @media (prefers-reduced-motion: reduce) { .conn.animating .dot { animation: none; } }
  .conn .rate {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center;
    background: var(--flow); color: var(--flow-ink); border-radius: 999px;
    padding: 2px 7px 2px 4px; box-shadow: var(--shadow);
  }
  .conn .rate input {
    width: 44px; border: none; background: transparent; color: var(--flow-ink);
    font-family: var(--font-num); font-size: 12.5px; font-weight: 700; text-align: right; padding: 1px 2px;
  }
  .conn .rate input:focus { outline: 1px solid rgba(255,255,255,0.7); border-radius: 4px; }
  .conn .rate .pct { font-size: 11px; font-weight: 700; }
  .conn .addbtn {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px dashed var(--ink-3); background: var(--chrome); color: var(--ink-2);
    font-size: 13px; line-height: 1; cursor: pointer; opacity: 0; display: grid; place-items: center;
  }
  .conn:hover .addbtn, .conn .addbtn:focus-visible { opacity: 1; }
  .board .end-add {
    margin-left: 18px; flex: none;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px dashed var(--ink-3); background: transparent; color: var(--ink-2);
    font-size: 18px; cursor: pointer;
  }
  .board .end-add:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- Sidebar (ink panel) ---------- */
  .sidebar { width: 304px; flex: none; overflow-y: auto; background: var(--panel); color: var(--panel-ink); }
  .sb-section { border-bottom: 1px solid var(--panel-3); }
  .sb-section > summary {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; list-style: none; user-select: none;
    font-family: var(--font-title); font-weight: 800; font-size: 13.5px; letter-spacing: 0.01em;
    background: var(--panel-2);
  }
  .sb-section > summary::-webkit-details-marker { display: none; }
  .sb-section > summary::after { content: "▾"; color: var(--panel-ink-2); font-size: 11px; }
  .sb-section:not([open]) > summary::after { content: "▸"; }
  .sb-note { padding: 6px 14px 0; font-size: 10.5px; color: var(--panel-ink-2); text-transform: uppercase; letter-spacing: 0.07em; }
  .sb-rows { padding: 6px 0 10px; }
  .sb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 14px; font-size: 13px; }
  .sb-row .k { color: var(--panel-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-row .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sb-row.total { border-top: 1px solid var(--panel-3); margin-top: 4px; padding-top: 8px; }
  .sb-row.total .k { color: var(--panel-ink); font-weight: 700; }
  .sb-row.total .v { color: var(--orange); font-weight: 700; }
  .sb-row input {
    width: 64px; font-family: var(--font-num); font-size: 12.5px; text-align: right;
    color: var(--panel-ink); background: var(--panel-2);
    border: 1px solid var(--panel-3); border-radius: 6px; padding: 3px 6px;
  }
  .sb-bar { height: 3px; border-radius: 2px; background: var(--flow); margin: 0 14px 2px; opacity: 0.85; }
  .profit-hero { padding: 14px; text-align: center; }
  .profit-hero .label { font-size: 10.5px; color: var(--panel-ink-2); text-transform: uppercase; letter-spacing: 0.1em; }
  .profit-hero .num {
    font-family: var(--font-title); font-variant-numeric: tabular-nums;
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px;
  }
  .profit-hero .num.pos { color: var(--flow); }
  .profit-hero .num.neg { color: var(--accent); }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--panel-3); }
  .kpi { background: var(--panel); padding: 8px 12px; }
  .kpi .kk { font-size: 10px; color: var(--panel-ink-2); text-transform: uppercase; letter-spacing: 0.08em; }
  .kpi .kv { font-family: var(--font-title); font-variant-numeric: tabular-nums; font-size: 15.5px; font-weight: 800; margin-top: 1px; }
  .sim-empty { padding: 12px 14px 16px; font-size: 12px; color: var(--panel-ink-2); }
  .sim-res { padding: 8px 0 14px; }
  .sim-res .chance { text-align: center; padding: 4px 14px 10px; font-size: 13px; }
  .sim-res .chance b { font-family: var(--font-title); font-size: 17px; }
  .sim-res table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .sim-res th, .sim-res td { padding: 4px 14px; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .sim-res th { color: var(--panel-ink-2); font-family: var(--font-ui); font-weight: 600; font-size: 11px; }
  .sim-res th:first-child, .sim-res td:first-child { text-align: left; font-family: var(--font-ui); color: var(--panel-ink-2); }
  .histo { display: block; margin: 10px 14px 0; }
  .histo-cap { font-size: 10.5px; color: var(--panel-ink-2); padding: 2px 14px 0; display: flex; justify-content: space-between; font-family: var(--font-num); }

  /* ---------- Add-step menu ---------- */
  .menu {
    position: fixed; z-index: 50; min-width: 220px;
    background: var(--chrome); border: 1px solid var(--card-border);
    border-radius: 12px; box-shadow: var(--shadow); padding: 5px;
  }
  .menu button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    font: inherit; font-weight: 600; text-align: left; color: var(--ink);
    background: none; border: none; border-radius: 8px; padding: 7px 9px; cursor: pointer;
  }
  .menu button:hover { background: var(--canvas); }
  .menu button .mi { color: var(--ink-2); display: grid; place-items: center; }
  .menu button small { color: var(--ink-3); margin-left: auto; }

  /* ---------- Modal ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(22, 50, 58, 0.5); display: grid; place-items: center; }
  .modal {
    width: min(560px, 92vw); background: var(--chrome); color: var(--ink);
    border: 1px solid var(--card-border); border-radius: 16px; box-shadow: var(--shadow);
    padding: 18px;
  }
  .modal h3 { margin: 0 0 8px; font-family: var(--font-title); font-weight: 800; font-size: 16px; }
  .modal textarea {
    width: 100%; height: 200px; resize: vertical;
    font-family: var(--font-num); font-size: 12px;
    color: var(--ink); background: var(--canvas);
    border: 1px solid var(--card-border); border-radius: 10px; padding: 8px;
  }
  .modal .mrow { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; }
  .modal .err { color: var(--danger); font-size: 12px; margin-right: auto; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Funnel Lab<span class="dot">.</span></div>
    <span class="hint-month">tout est mensuel ✦</span>
    <div class="spacer"></div>
    <select id="currencySel" title="Devise">
      <option value="€">EUR €</option>
      <option value="$">USD $</option>
      <option value="£">GBP £</option>
    </select>
    <button class="btn" id="btnExport">Exporter</button>
    <button class="btn" id="btnImport">Importer</button>
    <button class="btn" id="btnReset" title="Remettre ce funnel à ses valeurs de départ">Réinitialiser</button>
    <button class="btn btn-sim" id="btnSim" title="1 000 mois simulés avec les plages min et max de chaque étape">⚗ Simuler</button>
  </header>
  <div class="infobar" id="infobar"></div>
  <div class="main">
    <nav class="nav" id="funnelNav" aria-label="Choisir un funnel"></nav>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <aside class="sidebar" id="sidebar"></aside>
  </div>
</div>

<script>
"use strict";

/* ================= Icons ================= */
const PAGE_FRAME = '<rect x="4" y="3" width="22" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="4" y1="9" x2="26" y2="9" stroke="currentColor" stroke-width="1.6"/><circle cx="7.5" cy="6" r="1" class="ic-accent"/><circle cx="10.5" cy="6" r="1" class="ic-accent"/>';
function pageIcon(inner) {
  return '<svg width="30" height="36" viewBox="0 0 30 36" aria-hidden="true">' + PAGE_FRAME + inner + '</svg>';
}
const ICONS = {
  traffic: '<svg width="34" height="36" viewBox="0 0 34 36" aria-hidden="true">'
    + '<circle cx="17" cy="18" r="13.5" fill="none" stroke="currentColor" stroke-width="1.8"/>'
    + '<circle cx="17" cy="14" r="4" class="ic-accent"/>'
    + '<path d="M9.5 26c1.2-4 4-6 7.5-6s6.3 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
    + '</svg>',
  optin: pageIcon('<line x1="8" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1.4"/><line x1="8" y1="18" x2="18" y2="18" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="22" width="14" height="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="8" y="27" width="14" height="3.5" rx="1" class="ic-accent"/>'),
  webinar: pageIcon('<circle cx="15" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 16.5v7l5.5-3.5z" class="ic-accent"/>'),
  survey: pageIcon('<rect x="8" y="13" width="3.5" height="3.5" class="ic-flow"/><line x1="14" y1="15" x2="22" y2="15" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="20" width="3.5" height="3.5" class="ic-flow"/><line x1="14" y1="22" x2="22" y2="22" stroke="currentColor" stroke-width="1.4"/><line x1="8" y1="28.5" x2="18" y2="28.5" stroke="currentColor" stroke-width="1.4"/>'),
  call: pageIcon('<rect x="8" y="13" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="18" x2="22" y2="18" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="22.5" r="1.4" class="ic-accent"/><circle cx="18" cy="22.5" r="1.4" fill="currentColor"/>'),
  person: pageIcon('<circle cx="15" cy="17" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 29c1.2-3.6 3.6-5.4 6.5-5.4s5.3 1.8 6.5 5.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M18.5 18.5l2 2 3.5-3.8" fill="none" stroke="var(--flow)" stroke-width="1.8" stroke-linecap="round"/>'),
  sales: pageIcon('<path d="M9 14h7l7 7-7 7-7-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12.5" cy="17.5" r="1.5" class="ic-accent"/>'),

  const t = TEMPLATES[key] || TEMPLATES.solv;
  state = JSON.parse(JSON.stringify({ template: key, currency: t.currency, costs: t.costs, steps: t.steps }));
  state.steps.forEach(s => { s.id = newId(); });
  simResults = null;
}

/* currency is a closed enum: anything else (esp. from imported JSON) is dropped */
function normalizeCurrency(s) {
  if (!['€', '$', '£'].includes(s.currency)) s.currency = '€';
}
function normalizeCosts(s) {
  const c = (s.costs && typeof s.costs === 'object' && !Array.isArray(s.costs)) ? s.costs : {};
  s.costs = { feePct: clamp(num(c.feePct), 0, 100), perSale: Math.max(0, num(c.perSale)), fixed: Math.max(0, num(c.fixed)) };
}

function restoreTpl(key) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.steps) || !s.steps.length || s.steps[0].type !== 'traffic') return false;
    normalizeCurrency(s);
    normalizeCosts(s);
    s.template = key;
    state = s;
    let maxN = 0;
    s.steps.forEach(st => { const n = parseInt(String(st.id).slice(1), 10); if (n > maxN) maxN = n; });
    uid = maxN + 1;
    simResults = null;
    return true;
  } catch (e) { return false; }
}

function persist() {
  try {
    localStorage.setItem(LS_PREFIX + (state.template || 'custom'), JSON.stringify(state));
    localStorage.setItem(LS_LAST, state.template || 'custom');
  } catch (e) { /* storage may be unavailable */ }
}
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 250);
}

/* ================= Math ================= */
function num(v, fallback) { const n = parseFloat(v); return isFinite(n) ? n : (fallback || 0); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function stepRate(s) { return clamp(num(s.rate), 0, 100); }

/* Deterministic (expected value) walk of the chain. */
function computeChain() {
  const counts = [];
  let n = 0;
  state.steps.forEach((s, i) => {
    if (i === 0) { n = Math.max(0, num(s.visitors)); }
    else { n = n * stepRate(s) / 100; }
    counts.push(n);
  });
  return counts;
}

function computeSummary() {
  const counts = computeChain();
  const t = state.steps[0];
  const adCost = Math.max(0, num(t.visitors)) * Math.max(0, num(t.cpc));
  let revenue = 0;
  const products = [];
  let buyers = 0, totalSales = 0;
  state.steps.forEach((s, i) => {
    if (s.type === 'sales') {
      const r = counts[i] * Math.max(0, num(s.price));
      revenue += r;
      products.push({ name: s.name, price: num(s.price), buyers: counts[i], revenue: r });
      if (!buyers) buyers = counts[i];
      totalSales += counts[i];
    }
  });
  const fees = revenue * clamp(num(state.costs.feePct), 0, 100) / 100;
  const delivery = totalSales * Math.max(0, num(state.costs.perSale));
  const fixed = Math.max(0, num(state.costs.fixed));
  const totalCost = adCost + fees + delivery + fixed;
  const leads = counts.length > 1 ? counts[1] : 0;
  return {
    counts, adCost, revenue, products, buyers, totalSales, fees, delivery, fixed, totalCost,
    profit: revenue - totalCost,
    roas: adCost > 0 ? revenue / adCost : null,
    cpl: leads > 0 && adCost > 0 ? adCost / leads : (adCost > 0 ? null : null),
    cac: buyers > 0 && adCost > 0 ? adCost / buyers : null,
    aov: buyers > 0 ? revenue / buyers : null,
    epc: counts[0] > 0 ? revenue / counts[0] : null
  };
}

/* ---- Monte-Carlo ---- */
function triang(a, c, b) {
  if (b <= a) return a;
  const u = Math.random(), F = (c - a) / (b - a);
  return u < F ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c));
}
let gaussSpare = null;
function gauss() {
  if (gaussSpare !== null) { const v = gaussSpare; gaussSpare = null; return v; }
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const m = Math.sqrt(-2 * Math.log(u));
  gaussSpare = m * Math.sin(2 * Math.PI * v);
  return m * Math.cos(2 * Math.PI * v);
}
function binomial(n, p) {
  n = Math.round(n);
  if (n <= 0 || p <= 0) return 0;
  if (p >= 1) return n;
  if (n <= 300) {
    let k = 0;
    for (let i = 0; i < n; i++) if (Math.random() < p) k++;
    return k;
  }
  const mean = n * p, sd = Math.sqrt(n * p * (1 - p));
  return clamp(Math.round(mean + gauss() * sd), 0, n);
}
function percentile(sorted, q) {
  if (!sorted.length) return 0;
  const idx = (sorted.length - 1) * q;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

function runSimulation(runs) {
  runs = runs || 1000;
  const S = state.steps;
  const perStep = S.map(() => new Array(runs));
  const profits = new Array(runs), revenues = new Array(runs), salesArr = new Array(runs);
  const t = S[0];
  const vari = clamp(num(t.vari), 0, 90) / 100;
  const v0 = Math.max(0, num(t.visitors)), cpc0 = Math.max(0, num(t.cpc));
  for (let r = 0; r < runs; r++) {
    let n = Math.round(triang(v0 * (1 - vari), v0, v0 * (1 + vari)));
    const cpc = triang(cpc0 * (1 - vari), cpc0, cpc0 * (1 + vari));
    const adCost = n * cpc;
    let revenue = 0, buyers = 0, totalSales = 0;
    perStep[0][r] = n;
    for (let i = 1; i < S.length; i++) {
      const s = S[i];
      const mode = stepRate(s);
      const mn = num(s.min, mode), mx = num(s.max, mode);
      const lo = clamp(Math.min(mn, mx, mode), 0, 100);
      const hi = clamp(Math.max(mn, mx, mode), 0, 100);
      const p = triang(lo, mode, hi) / 100;
      n = binomial(n, p);
      perStep[i][r] = n;
      if (s.type === 'sales') {
        revenue += n * Math.max(0, num(s.price));
        if (!buyers) buyers = n;
        totalSales += n;
      }
    }
    const fees = revenue * clamp(num(state.costs.feePct), 0, 100) / 100;
    const delivery = totalSales * Math.max(0, num(state.costs.perSale));
    const cost = adCost + fees + delivery + Math.max(0, num(state.costs.fixed));
    profits[r] = revenue - cost;
    revenues[r] = revenue;
    salesArr[r] = totalSales;
  }
  const sortNum = a => a.slice().sort((x, y) => x - y);
  const pf = sortNum(profits), rv = sortNum(revenues), by = sortNum(salesArr);
  simResults = {
    runs,
    profit:  { p10: percentile(pf, 0.1), p50: percentile(pf, 0.5), p90: percentile(pf, 0.9) },
    revenue: { p10: percentile(rv, 0.1), p50: percentile(rv, 0.5), p90: percentile(rv, 0.9) },
    buyers:  { p10: percentile(by, 0.1), p50: percentile(by, 0.5), p90: percentile(by, 0.9) },
    chance: profits.filter(p => p > 0).length / runs,
    profits: pf,
    perStep: perStep.map(arr => {
      const s = sortNum(arr);
      return { p10: percentile(s, 0.1), p90: percentile(s, 0.9) };
    })
  };
}

/* ================= Formatting ================= */
function cur() { return state.currency || '€'; }
function fmtPeople(n) {
  if (!isFinite(n)) return '·';
  if (n >= 100) return Math.round(n).toLocaleString('fr-FR');
  return (Math.round(n * 10) / 10).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}
function fmtMoney(n) {
  if (n === null || !isFinite(n)) return '·';
  const neg = n < 0; const a = Math.abs(n);
  const s = a >= 100 ? Math.round(a).toLocaleString('fr-FR')
        : a.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? '−' : '') + s + ' ' + cur();
}
function fmtRatio(n) { return n === null || !isFinite(n) ? '·' : (Math.round(n * 100) / 100).toLocaleString('fr-FR'); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ================= Rendering ================= */
function render() {
  renderNav();
  renderInfobar();
  renderBoard();
  renderSidebar();
  recalc();
}

function renderNav() {
  const nav = $('#funnelNav');
  nav.innerHTML = NAV.map(g =>
    '<div class="grp">' + esc(g.label) + '</div>'
    + g.items.map(it => {
      const key = it[0], m = META[key] || {};
      const active = state.template === key;
      return '<button data-key="' + key + '"' + (active ? ' class="active" aria-current="true"' : '') + '>'
        + '<span class="fdot ' + (m.cat || 'mine') + '"></span>'
        + esc(it[1])
        + (m.counter ? '<span class="wmark" title="Contre-exemple documenté">⚠</span>' : '')
        + '</button>';
    }).join('')
  ).join('');
  $$('#funnelNav button').forEach(b => b.addEventListener('click', () => setFunnel(b.dataset.key)));
}

/* switching is non-destructive: each funnel keeps its own saved board */
function setFunnel(key) {
  if (!TEMPLATES[key] || key === state.template) return;
  persist();
  if (!restoreTpl(key)) loadTemplate(key);
  $('#currencySel').value = state.currency;
  scheduleSave(); render();
}

function frange(pair, unit) {
  if (!pair) return null;
  const a = pair[0], b = pair[1];
  if (a === b) return fmtNum(a) + unit;
  return fmtNum(a) + ' à ' + fmtNum(b) + unit;
}
function fmtNum(n) { return n.toLocaleString('fr-FR', { maximumFractionDigits: 2 }); }
const CAT_FR = { paid: 'payant', organic: 'organique', hybrid: 'hybride', mine: '' };
const CONF_FR = { high: 'confiance haute', medium: 'confiance moyenne', low: 'confiance faible' };
const CONF_CLS = { high: 'organic', medium: 'hybrid', low: 'paid' };

function renderInfobar() {
  const key = state.template;
  const m = META[key] || {};
  let chips = '';
  if (m.cat && m.cat !== 'mine') chips += '<span class="ichip ' + m.cat + '">' + CAT_FR[m.cat] + '</span>';
  if (m.conf) chips += '<span class="ichip ' + CONF_CLS[m.conf] + '">' + CONF_FR[m.conf] + '</span>';
  if (m.ticket) chips += '<span class="ichip">ticket ' + frange(m.ticket, ' €') + '</span>';
  if (m.cpl) chips += '<span class="ichip">CPL cible ' + frange(m.cpl, ' $') + '</span>';
  if (m.cac) chips += '<span class="ichip">CAC cible ' + frange(m.cac, ' $') + '</span>';
  if (m.hps) chips += '<span class="ichip">' + frange(m.hps, ' h') + ' / vente</span>';
  if (m.cap) chips += '<span class="ichip">cap ' + m.cap + ' /mois</span>';
  if (m.counter) chips += '<span class="ichip warn">⚠ contre-exemple : lire avant d’investir</span>';
  if (m.multi) chips += '<span class="ichip">multiplicateur : à combiner avec un autre funnel</span>';
  if (m.nurt) chips += '<span class="ichip">nurturing : pas un canal d’acquisition froide</span>';
  if (m.note) chips += '<span class="ichip">' + esc(m.note) + '</span>';
  $('#infobar').innerHTML = '<span class="fname">' + esc(NAV_NAMES[key] || key) + '</span>' + chips;
}

function renderBoard() {
  const board = $('#board');
  board.innerHTML = '';
  state.steps.forEach((s, i) => {
    if (i > 0) board.appendChild(connEl(s, i));
    board.appendChild(stepEl(s, i));
  });
  const add = document.createElement('button');
  add.className = 'end-add';
  add.title = 'Ajouter une étape à la fin';
  add.textContent = '+';
  add.addEventListener('click', e => openMenu(e.clientX, e.clientY, state.steps.length));
  board.appendChild(add);
}

function connEl(s, i) {
  const el = document.createElement('div');
  el.className = 'conn';
  el.innerHTML = '<div class="line"></div><div class="dot"></div>'
    + '<span class="rate"><input type="number" step="0.1" min="0" max="100" value="' + esc(s.rate) + '" aria-label="Taux de conversion vers ' + esc(s.name) + '"><span class="pct">%</span></span>'
    + '<button class="addbtn" title="Insérer une étape ici">+</button>';
  const input = $('input', el);
  input.addEventListener('input', () => { s.rate = num(input.value); touch(); });
  input.addEventListener('change', () => { input.value = stepRate(s); });
  $('.addbtn', el).addEventListener('click', e => openMenu(e.clientX, e.clientY, i));
  return el;
}

function stepEl(s, i) {
  const el = document.createElement('div');
  el.className = 'step' + (s.type === 'sales' ? ' is-sales' : '');
  el.dataset.id = s.id;

  let tools = '';
  if (i > 0) {
    tools = '<div class="step-tools">'
      + (i > 1 ? '<button class="mv-l" title="Déplacer à gauche">‹</button>' : '')
      + (i < state.steps.length - 1 ? '<button class="mv-r" title="Déplacer à droite">›</button>' : '')
      + '<button class="del" title="Supprimer l’étape">✕</button></div>';
  }

  let body = '';
  if (s.type === 'traffic') {
    body = '<div class="frow"><label>Volume / mois</label><input class="in-visitors" type="number" min="0" step="10" value="' + esc(s.visitors) + '"></div>'
      + '<div class="frow"><label>Coût par clic</label><input class="in-cpc" type="number" min="0" step="0.01" value="' + esc(s.cpc) + '"></div>'
      + '<details class="adv"><summary>Plage de simulation</summary>'
      + '<div class="frow"><label>Variabilité ±%</label><input class="in-vari" type="number" min="0" max="90" step="1" value="' + esc(s.vari == null ? '' : s.vari) + '"></div></details>';
  } else {
    const mn = s.min == null ? '' : s.min, mx = s.max == null ? '' : s.max;
    const price = s.type === 'sales'
      ? '<div class="frow"><label>Prix</label><input class="in-price" type="number" min="0" step="1" value="' + esc(s.price) + '"></div>' : '';
    body = price
      + '<details class="adv"><summary>Plage de simulation</summary>'
      + '<div class="frow"><label>Taux min et max %</label><span>'
      + '<input class="in-min" type="number" min="0" max="100" step="0.5" value="' + esc(mn) + '" aria-label="Taux minimum"> – '
      + '<input class="in-max" type="number" min="0" max="100" step="0.5" value="' + esc(mx) + '" aria-label="Taux maximum">'
      + '</span></div></details>';
  }

  const unit = s.type === 'sales' ? 'ventes/mois' : (i === 0 ? (s.unit || 'clics/mois') : '/mois');
  el.innerHTML = tools
    + '<div class="step-head"><span class="step-icon">' + (ICONS[s.icon] || ICONS.page) + '</span>'
    + '<input class="step-name" value="' + esc(s.name) + '" aria-label="Nom de l’étape"></div>'
    + '<div class="step-body">' + body + '</div>'
    + '<div class="step-count"><span class="big"><span class="cnt">0</span><span class="unit">' + esc(unit) + '</span></span>'
    + '<span class="simrange" hidden></span>'
    + '<div class="cap"></div>'
    + (s.type === 'sales' ? '<div class="money"></div>' : '')
    + '</div>';

  $('.step-name', el).addEventListener('change', e => { s.name = e.target.value.trim() || s.name; e.target.value = s.name; touch(); renderProducts(); });
  const wire = (sel, fn) => { const inp = $(sel, el); if (inp) inp.addEventListener('input', () => { fn(inp); touch(); }); };
  wire('.in-visitors', inp => { s.visitors = Math.max(0, num(inp.value)); });
  wire('.in-cpc', inp => { s.cpc = Math.max(0, num(inp.value)); });
  wire('.in-vari', inp => { s.vari = inp.value === '' ? null : clamp(num(inp.value), 0, 90); });
  wire('.in-price', inp => { s.price = Math.max(0, num(inp.value)); });
  wire('.in-min', inp => { s.min = inp.value === '' ? null : clamp(num(inp.value), 0, 100); });
  wire('.in-max', inp => { s.max = inp.value === '' ? null : clamp(num(inp.value), 0, 100); });

  const on = (sel, fn) => { const b = $(sel, el); if (b) b.addEventListener('click', fn); };
  on('.del', () => { state.steps.splice(i, 1); touch(); render(); });
  on('.mv-l', () => { swap(i, i - 1); });
  on('.mv-r', () => { swap(i, i + 1); });
  return el;
}

function swap(a, b) {
  if (b < 1 || b >= state.steps.length) return;
  const t = state.steps[a]; state.steps[a] = state.steps[b]; state.steps[b] = t;
  touch(); render();
}

/* Called on every value edit: invalidates sim, recomputes, autosaves. */
function touch() {
  simResults = null;
  recalc();
  scheduleSave();
}

/* Update all display-only nodes without rebuilding inputs (keeps focus). */
function recalc() {
  const sum = computeSummary();
  const steps = state.steps;
  $$('#board .step').forEach((el, idx) => {
    const s = steps[idx];
    if (!s) return;
    const n = sum.counts[idx];
    $('.cnt', el).textContent = fmtPeople(n);
    const cap = $('.cap', el);
    if (idx === 0) {
      cap.textContent = 'dépense pub ' + fmtMoney(sum.adCost);
    } else {
      cap.textContent = 'sur ' + fmtPeople(sum.counts[idx - 1]) + ' · ' + stepRate(s) + ' %';
    }
    if (s.type === 'sales') {
      $('.money', el).textContent = fmtMoney(n * Math.max(0, num(s.price))) + ' /mois';
    }
    const sr = $('.simrange', el);
    if (simResults && simResults.perStep[idx]) {
      sr.hidden = false;
      sr.textContent = 'sim ' + fmtPeople(simResults.perStep[idx].p10) + ' – ' + fmtPeople(simResults.perStep[idx].p90);
    } else { sr.hidden = true; }
  });
  renderProducts();
  renderTrafficRows(sum);
  renderExpenseVals(sum);
  renderSummaryVals(sum);
  renderSimPanel();
}

function renderProducts() {
  const box = $('#sbProducts');
  if (!box) return;
  const sum = computeSummary();
  if (!sum.products.length) {
    box.innerHTML = '<div class="sb-row"><span class="k">Pas encore d’étape de vente : ajoute-la avec +</span></div>';
    return;
  }
  const maxR = Math.max.apply(null, sum.products.map(p => p.revenue).concat([1]));
  box.innerHTML = sum.products.map(p =>
    '<div class="sb-row"><span class="k" title="' + esc(p.name) + '">' + esc(p.name) + ' (' + fmtMoney(p.price) + ')</span><span class="v">' + fmtMoney(p.revenue) + '</span></div>'
    + '<div class="sb-bar" style="width:' + Math.max(4, Math.round(240 * p.revenue / maxR)) + 'px"></div>'
  ).join('')
  + '<div class="sb-row total"><span class="k">Total</span><span class="v">' + fmtMoney(sum.revenue) + '</span></div>';
}

function renderExpenseVals(sum) {
  if (!$('#expTraffic')) return;
  $('#expTraffic').textContent = fmtMoney(sum.adCost);
  $('#expFees').textContent = fmtMoney(sum.fees);
  $('#expDelivery').textContent = fmtMoney(sum.delivery);
  $('#expTotal').textContent = fmtMoney(sum.totalCost);
}

function renderSummaryVals(sum) {
  if (!$('#sumProfit')) return;
  const p = $('#sumProfit');
  p.textContent = fmtMoney(sum.profit);
  p.className = 'num ' + (sum.profit >= 0 ? 'pos' : 'neg');
  $('#sumRevenue').textContent = fmtMoney(sum.revenue);
  $('#sumCosts').textContent = fmtMoney(sum.totalCost);
  $('#sumRoas').textContent = sum.roas === null ? '·' : fmtRatio(sum.roas) + '×';
  $('#sumEpc').textContent = fmtMoney(sum.epc);
  $('#sumCpl').textContent = fmtMoney(sum.cpl);
  $('#sumCac').textContent = fmtMoney(sum.cac);
  $('#sumAov').textContent = fmtMoney(sum.aov);
  $('#sumSales').textContent = fmtPeople(sum.totalSales);
}

function renderSimPanel() {
  const box = $('#simPanel');
  if (!box) return;
  if (!simResults) {
    box.innerHTML = '<div class="sim-empty">Clique <b>⚗ Simuler</b> pour lancer 1 000 mois de Monte-Carlo avec les plages min et max de chaque étape. Les résultats s’affichent ici et sous chaque étape.</div>';
    return;
  }
  const R = simResults;
  const pct = Math.round(R.chance * 100);
  box.innerHTML =
    '<div class="sim-res">'
    + '<div class="chance">Mois profitables : <b style="color:' + (pct >= 50 ? 'var(--flow)' : 'var(--accent)') + '">' + pct + ' %</b> sur ' + R.runs.toLocaleString('fr-FR') + ' tirages</div>'
    + '<table><tr><th></th><th>P10</th><th>médiane</th><th>P90</th></tr>'
    + '<tr><td>Profit</td><td>' + fmtMoney(R.profit.p10) + '</td><td>' + fmtMoney(R.profit.p50) + '</td><td>' + fmtMoney(R.profit.p90) + '</td></tr>'
    + '<tr><td>Revenu</td><td>' + fmtMoney(R.revenue.p10) + '</td><td>' + fmtMoney(R.revenue.p50) + '</td><td>' + fmtMoney(R.revenue.p90) + '</td></tr>'
    + '<tr><td>Ventes</td><td>' + fmtPeople(R.buyers.p10) + '</td><td>' + fmtPeople(R.buyers.p50) + '</td><td>' + fmtPeople(R.buyers.p90) + '</td></tr>'
    + '</table>'
    + histogramSVG(R.profits)
    + '</div>';
}

/* Profit distribution histogram: coral below zero, turquoise above. */
function histogramSVG(sorted) {
  if (!sorted.length) return '';
  const W = 276, H = 74, BINS = 26;
  const min = sorted[0], max = sorted[sorted.length - 1];
  const span = (max - min) || 1;
  const bins = new Array(BINS).fill(0);
  sorted.forEach(v => {
    const b = clamp(Math.floor((v - min) / span * BINS), 0, BINS - 1);
    bins[b]++;
  });
  const peak = Math.max.apply(null, bins) || 1;
  const bw = W / BINS;
  let bars = '';
  for (let i = 0; i < BINS; i++) {
    const h = Math.round((H - 4) * bins[i] / peak);
    if (!h) continue;
    const center = min + (i + 0.5) / BINS * span;
    const col = center < 0 ? 'var(--accent)' : 'var(--flow)';
    bars += '<rect x="' + (i * bw + 1).toFixed(1) + '" y="' + (H - h) + '" width="' + (bw - 2).toFixed(1) + '" height="' + h + '" rx="2" fill="' + col + '"/>';
  }
  let zeroLine = '';
  if (min < 0 && max > 0) {
    const zx = ((0 - min) / span * W).toFixed(1);
    zeroLine = '<line x1="' + zx + '" y1="0" x2="' + zx + '" y2="' + H + '" stroke="var(--panel-ink-2)" stroke-width="1" stroke-dasharray="2 3"/>';
  }
  return '<svg class="histo" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Distribution du profit sur les mois simulés">'
    + bars + zeroLine + '</svg>'
    + '<div class="histo-cap"><span>' + fmtMoney(min) + '</span><span>profit / mois</span><span>' + fmtMoney(max) + '</span></div>';
}

/* ================= Add-step menu ================= */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(x, y, insertAt) {
  closeMenu();
  menuEl = document.createElement('div');
  menuEl.className = 'menu';
  menuEl.innerHTML = KINDS.map((k, i) =>
    '<button data-k="' + i + '"><span class="mi">' + ICONS[k.icon] + '</span>' + esc(k.name)
    + (k.sales ? '<small>' + k.price + ' ' + cur() + '</small>' : '<small>' + k.rate + ' %</small>') + '</button>'
  ).join('');
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = clamp(x - 20, 8, window.innerWidth - r.width - 8) + 'px';
  menuEl.style.top = clamp(y + 8, 8, window.innerHeight - r.height - 8) + 'px';
  $$('button', menuEl).forEach(b => b.addEventListener('click', () => {
    const k = KINDS[+b.dataset.k];
    const step = {
      id: newId(), type: k.sales ? 'sales' : 'page', icon: k.icon, name: k.name,
      rate: k.rate,
      min: Math.max(0, Math.round(k.rate * 0.6 * 10) / 10),
      max: Math.min(100, Math.round(k.rate * 1.4 * 10) / 10)
    };
    if (k.sales) step.price = k.price;
    state.steps.splice(Math.max(1, insertAt), 0, step);
    closeMenu();
    touch(); render();
  }));
  setTimeout(() => document.addEventListener('click', onDocClickMenu), 0);
}
function onDocClickMenu(e) {
  if (menuEl && !menuEl.contains(e.target)) { closeMenu(); document.removeEventListener('click', onDocClickMenu); }
}

/* ================= Modals (export / import / confirm) ================= */
function modal(title, bodyHTML, actions) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3>' + bodyHTML + '<div class="mrow"><span class="err"></span>' + actions + '</div></div>';
  let downOnBack = false;
  back.addEventListener('pointerdown', e => { downOnBack = (e.target === back); });
  back.addEventListener('click', e => { if (e.target === back && downOnBack) back.remove(); });
  document.body.appendChild(back);
  return back;
}
function appConfirm(msg, onOk) {
  const back = modal('Tu es sûr ?', '<p style="margin:4px 0 0">' + esc(msg) + '</p>',
    '<button class="btn" data-a="ok">Oui</button><button class="btn" data-a="close">Annuler</button>');
  $('[data-a="close"]', back).addEventListener('click', () => back.remove());
  $('[data-a="ok"]', back).addEventListener('click', () => { back.remove(); onOk(); });
}
function doExport() {
  const json = JSON.stringify(state, null, 2);
  const back = modal('Exporter le funnel (JSON)',
    '<textarea readonly>' + esc(json) + '</textarea>',
    '<button class="btn" data-a="copy">Copier</button><button class="btn" data-a="close">Fermer</button>');
  const ta = $('textarea', back);
  $('[data-a="copy"]', back).addEventListener('click', () => {
    ta.select();
    if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => document.execCommand('copy'));
    else document.execCommand('copy');
    $('[data-a="copy"]', back).textContent = 'Copié ✓';
  });
  $('[data-a="close"]', back).addEventListener('click', () => back.remove());
}
function doImport() {
  const back = modal('Importer un funnel (colle le JSON)',
    '<textarea placeholder=\'{"steps": [...]}\'></textarea>',
    '<button class="btn" data-a="load">Charger</button><button class="btn" data-a="close">Fermer</button>');
  $('[data-a="close"]', back).addEventListener('click', () => back.remove());
  $('[data-a="load"]', back).addEventListener('click', () => {
    try {
      const s = JSON.parse($('textarea', back).value);
      if (!s || !Array.isArray(s.steps) || !s.steps.length) throw new Error('steps manquant');
      if (s.steps[0].type !== 'traffic') throw new Error('la première étape doit être une source de trafic');
      s.steps.forEach(st => { if (!st.id) st.id = newId(); });
      normalizeCosts(s);
      normalizeCurrency(s);
      s.template = TEMPLATES[s.template] ? s.template : state.template;
      state = s;
      simResults = null;
      $('#currencySel').value = state.currency;
      back.remove();
      scheduleSave(); render();
    } catch (err) {
      $('.err', back).textContent = 'JSON invalide : ' + err.message;
    }
  });
}

/* ================= Wiring ================= */
function init() {
  /* migrate the old single-board save into the per-funnel store */
  try {
    const old = localStorage.getItem(LS_LEGACY);
    if (old) {
      const s = JSON.parse(old);
      const key = s && TEMPLATES[s.template] ? s.template : 'solv';
      if (!localStorage.getItem(LS_PREFIX + key)) localStorage.setItem(LS_PREFIX + key, old);
      localStorage.setItem(LS_LAST, key);
      localStorage.removeItem(LS_LEGACY);
    }
  } catch (e) { /* ignore */ }

  const last = localStorage.getItem(LS_LAST);
  const startKey = TEMPLATES[last] ? last : 'solv';
  if (!restoreTpl(startKey)) loadTemplate(startKey);
  $('#currencySel').value = ['€', '$', '£'].includes(state.currency) ? state.currency : '€';

  $('#currencySel').addEventListener('change', e => { state.currency = e.target.value; touch(); });
  $('#btnReset').addEventListener('click', () => {
    appConfirm('Remettre "' + (NAV_NAMES[state.template] || state.template) + '" à ses valeurs de départ ? Tes modifications sur ce funnel seront perdues.', () => {
      loadTemplate(state.template);
      $('#currencySel').value = state.currency;
      scheduleSave(); render();
    });
  });
  $('#btnExport').addEventListener('click', doExport);
  $('#btnImport').addEventListener('click', doImport);
  $('#btnSim').addEventListener('click', () => {
    runSimulation(1000);
    recalc();
    const panel = $('#simPanel');
    if (panel) {
      panel.closest('details').open = true;
      panel.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    $$('#board .conn').forEach(c => {
      c.classList.remove('animating');
      void c.offsetWidth;
      c.classList.add('animating');
    });
  });
  render();
}
init();
</script>
